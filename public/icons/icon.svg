<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Radial Glow Behind Emblem -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)"/>

  <!-- Flame / Chef Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer Shield / Plate Ring -->
    <circle cx="256" cy="240" r="148" fill="#18181b" stroke="url(#flameGrad)" stroke-width="14"/>

    <!-- Fork & Knife decorative lines -->
    <!-- Stylized Flame Body -->
    <path d="M256 120 C280 170, 330 200, 330 260 C330 310, 290 350, 256 350 C222 350, 182 310, 182 260 C182 210, 220 175, 235 155 C240 175, 252 195, 268 205 C250 175, 250 145, 256 120 Z" 
          fill="url(#flameGrad)"/>

    <!-- Inner Core Spark -->
    <path d="M256 245 C270 270, 275 285, 275 305 C275 325, 265 338, 256 338 C247 338, 237 325, 237 305 C237 285, 245 270, 256 245 Z" 
          fill="#fef08a"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="430" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#ffffff">
    SAZONARE
  </text>
  <text x="256" y="460" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="19" 
        font-weight="700" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#f97316">
    FOOD • POS
  </text>
</svg>

